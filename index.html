<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Waagerechter Wurf - Simulation (EF)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* iOS Safari Fix: Alles fixiert */
        html, body {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100%; height: 100%;
            overflow: hidden;
        }
        body {
            overscroll-behavior-y: none;
            touch-action: none;
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.7);
        }

        /* Schützt das Menü davor, vom Home-Balken moderner iPads verdeckt zu werden */
        #controls {
            padding-bottom: max(1.25rem, env(safe-area-inset-bottom));
        }

        .btn-didactic {
            background-color: #ffffff;
            color: #334155;
            border-color: #cbd5e1;
        }
        .btn-didactic:hover {
            background-color: #f1f5f9;
        }
        .btn-didactic.active {
            background-color: #10b981 !important;
            color: #ffffff !important;
            border-color: #059669 !important;
        }
    </style>
</head>
<body class="bg-gradient-to-b from-sky-400 to-sky-100 flex flex-col font-sans text-slate-800">

    <div class="flex-grow relative w-full">
        <canvas id="simCanvas" class="w-full h-full block"></canvas>

        <div id="results-box" class="absolute top-6 right-6 glass-panel shadow-lg rounded-xl p-5 text-lg min-w-[220px]">
            <div class="mb-3 border-b border-slate-300 pb-2">
                <span class="font-bold text-slate-700">Fallzeit t<sub>w</sub>:</span> 
                <span id="res-time" class="font-mono text-blue-700 font-bold text-xl float-right">?</span>
            </div>
            <div>
                <span class="font-bold text-slate-700">Wurfweite w:</span> 
                <span id="res-dist" class="font-mono text-blue-700 font-bold text-xl float-right">?</span>
            </div>
        </div>
    </div>

    <!-- Steuerungsmenü -->
    <div id="controls" class="glass-panel p-5 shrink-0 shadow-[0_-10px_30px_rgba(0,0,0,0.1)] z-10 rounded-t-2xl">
        <div class="flex flex-wrap items-end justify-center gap-6 max-w-7xl mx-auto">
            
            <div class="flex flex-col">
                <label for="height-slider" class="font-bold text-sm text-slate-700 mb-1">Flughöhe (m)</label>
                <!-- FIX: Startwert auf 500 gesetzt -->
                <input type="range" id="height-slider" min="100" max="3000" step="100" value="500" class="w-32 md:w-40 accent-blue-600 h-2 bg-slate-300 rounded-lg appearance-none cursor-pointer">
                <div class="text-xs text-slate-600 mt-2 font-mono bg-white px-2 py-1 rounded text-center border border-slate-200 shadow-sm"><span id="height-val" class="font-bold text-slate-800">500</span> m</div>
            </div>
            
            <div class="flex flex-col">
                <label for="speed-slider" class="font-bold text-sm text-slate-700 mb-1">Geschwindigkeit (km/h)</label>
                <!-- Startwert auf 252 gesetzt, step auf 1 -->
                <input type="range" id="speed-slider" min="50" max="500" step="1" value="252" class="w-32 md:w-40 accent-blue-600 h-2 bg-slate-300 rounded-lg appearance-none cursor-pointer">
                <div class="text-xs text-slate-600 mt-2 font-mono bg-white px-2 py-1 rounded text-center border border-slate-200 shadow-sm"><span id="speed-val" class="font-bold text-slate-800">252</span> km/h</div>
            </div>

            <div class="flex flex-col">
                <label for="target-input" class="font-bold text-sm text-slate-700 mb-1 max-w-[160px] leading-tight">Horizontale Entfernung zum Ziel-Dorf (m)</label>
                <input type="number" id="target-input" min="0" max="5000" value="0" class="w-full p-2 border border-slate-300 rounded-lg text-center font-mono focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all shadow-inner">
            </div>

            <div class="flex gap-2 ml-4">
                <button id="btn-start" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-xl shadow-md transition-all active:scale-95 text-lg">
                    Abwurf
                </button>
                <button id="btn-reset" class="bg-slate-500 hover:bg-slate-600 text-white font-bold py-3 px-5 rounded-xl shadow-md transition-all active:scale-95">
                    Reset
                </button>
            </div>
            
            <div class="flex flex-wrap gap-2 border-l-2 border-slate-300 pl-6 ml-2">
                <button id="btn-results" class="btn-didactic border border-slate-300 font-bold py-2 px-4 rounded-xl transition-all shadow-sm">
                    Ergebnisse
                </button>
                <button id="btn-part2" class="btn-didactic border border-slate-300 font-bold py-2 px-4 rounded-xl transition-all shadow-sm">
                    Teil 2
                </button>
                <button id="btn-vector-values" class="btn-didactic opacity-50 cursor-not-allowed border border-slate-300 font-bold py-2 px-4 rounded-xl transition-all shadow-sm">
                    Werte an Vektoren
                </button>
            </div>
        </div>
    </div>
